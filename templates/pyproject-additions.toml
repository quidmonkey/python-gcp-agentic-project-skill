[tool.ruff]
line-length = 88
# target-version is intentionally unset: ruff infers it from project.requires-python
# above, so the two can't drift apart.

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["{{package_name}}"]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.pytest.ini_options]
testpaths = ["{{test-dir}}"]
